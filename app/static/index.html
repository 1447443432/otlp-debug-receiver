<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTLP Debug Receiver</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141e31;--line:#29354a;--muted:#9fb0c7;--accent:#67d5bb;--fg:#e7eef7}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);margin:0}header{padding:20px 3vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}small,.muted{color:var(--muted)}main{padding:20px 3vw;max-width:1800px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card strong{font-size:27px;display:block;margin-top:6px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}button,input,select{border:1px solid #40516a;background:#101b2c;color:var(--fg);border-radius:8px;padding:9px 11px}button{cursor:pointer}button.active{color:#021c18;background:var(--accent);font-weight:700}.panel{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;table-layout:auto}th{text-align:left;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid #223045;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tr[data-trace]{cursor:pointer}tr[data-trace]:hover{background:#1c3145}code{color:#a9e2f1}#chart{display:flex;align-items:end;gap:2px;height:75px;margin:8px 0 0}#chart span{flex:1;background:linear-gradient(0deg,#327e87,var(--accent));min-width:2px;border-radius:2px 2px 0 0}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5;background:#0c1727;padding:14px;border-radius:7px;max-height:350px;overflow:auto}.trace-row{display:grid;grid-template-columns:minmax(150px,250px) 1fr 80px;gap:10px;padding:6px;border-bottom:1px solid var(--line);font-size:12px;align-items:center}.trace-bar{background:#263c50;height:17px;position:relative;border-radius:4px;overflow:hidden}.trace-bar i{display:block;position:absolute;height:100%;background:var(--accent);min-width:2px}.error{color:#ff908d}#message{margin:8px 0;color:#ffb98a}footer{padding:18px 3vw;color:var(--muted);font-size:12px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.trace-row{grid-template-columns:120px 1fr 55px}}</style></head>
<body><header><div><h1>◈ OTLP Debug Receiver</h1><small>Istio / Envoy · Traces + Logs · gRPC :4317</small></div><div><label for="token">访问令牌</label> <input id="token" type="password" placeholder="UI_TOKEN（可为空）"> <button id="saveToken">应用</button> <small id="state">未连接</small></div></header>
<main><div class="cards"><div class="card">累计接收 Span<strong id="countSpans">—</strong></div><div class="card">累计接收 Log<strong id="countLogs">—</strong></div><div class="card">当前保存 Span<strong id="storedSpans">—</strong></div><div class="card">当前保存 Log<strong id="storedLogs">—</strong></div></div>
<div class="panel"><strong>最近 60 分钟 Trace 接收趋势（按分钟）</strong><div id="chart"></div><small>统计的是接收时间，并非业务发生时间。刷新间隔 5 秒。</small></div>
<div class="controls"><button class="tab active" data-mode="spans">Span 列表</button><button class="tab" data-mode="logs">OTLP 日志</button><button class="tab" data-mode="runtime-logs">接收器运行日志</button><input id="service" placeholder="精确服务名过滤"><input id="search" placeholder="Trace ID / URL / 内容关键字"><button id="refresh">立即刷新</button><label><input type="checkbox" id="auto" checked> 自动刷新</label></div>
<div id="message" role="status"></div><section class="panel"><div id="rows">加载中...</div></section>
<div class="panel" id="detail" style="display:none;margin-top:16px"><button id="close">关闭详情</button><h3 id="traceTitle">调用链详情</h3><div id="waterfall"></div><h4>Span 原始属性 / Trace 相关日志</h4><pre id="raw"></pre></div></main><footer>仅供内网排障使用 · 查询 UI 与 OTLP 接收端默认未启用 TLS · 不建议接入公网或长期替代 Collector</footer>
<script>
const $=id=>document.getElementById(id);let mode='spans',running=false;const fmt=ns=>ns?new Date(Number(ns)/1e6).toLocaleString('zh-CN',{hour12:false}):'-';
$('token').value=sessionStorage.getItem('otlpToken')||'';
$('saveToken').onclick=()=>{sessionStorage.setItem('otlpToken',$('token').value);refresh()};
const api=async path=>{const tok=sessionStorage.getItem('otlpToken')||'';const r=await fetch(path,{headers:tok?{Authorization:'Bearer '+tok}:{}});if(!r.ok)throw new Error('HTTP '+r.status+' '+(r.status===401?'令牌错误或未提供':'请求失败'));return r.json()};
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n};
function table(columns,rows,traceClickable=false){const t=el('table'),head=el('tr');columns.forEach(c=>head.append(el('th',c[0])));t.append(head);for(const row of rows){const tr=el('tr');columns.forEach(([name,key])=>{let v=typeof key==='function'?key(row):row[key];tr.append(el('td',v==null?'-':typeof v==='object'?JSON.stringify(v):v))});if(traceClickable&&row.trace_id){tr.dataset.trace=row.trace_id;tr.onclick=()=>showTrace(row.trace_id)}t.append(tr)}return t}
async function refresh(){if(running)return;running=true;try{const s=await api('/api/stats');$('countSpans').textContent=s.counters.spans.toLocaleString();$('countLogs').textContent=s.counters.logs.toLocaleString();$('storedSpans').textContent=s.stored.spans.toLocaleString();$('storedLogs').textContent=s.stored.logs.toLocaleString();$('state').textContent='已连接';$('message').textContent='';const chart=$('chart');chart.replaceChildren();const now=Math.floor(Date.now()/60000);const m=new Map(s.recent_minutes.map(v=>[Math.floor(Number(v.bucket)/60000000000),v.n]));const max=Math.max(1,...m.values());for(let i=59;i>=0;i--){const bar=el('span');const n=m.get(now-i)||0;bar.style.height=Math.max(2,Math.round(n/max*70))+'px';bar.title=`${i} 分钟前: ${n} spans`;chart.append(bar)}let params=new URLSearchParams({limit:'100',service:$('service').value.trim(),q:$('search').value.trim()});let data=await api('/api/'+mode+(mode==='runtime-logs'?'?limit=150':'?'+params));let t;if(mode==='spans')t=table([['接收时间',r=>fmt(r.received_ns)],['服务','service'],['Span 名称','name'],['耗时(ms)','duration_ms'],['Trace ID','trace_id']],data,true);else if(mode==='logs')t=table([['接收时间',r=>fmt(r.received_ns)],['服务','service'],['级别','severity'],['日志正文','body'],['Trace ID','trace_id']],data,true);else t=table([['时间',r=>new Date(r.time*1000).toLocaleString()],['级别','level'],['模块','source'],['消息','message']],data);$('rows').replaceChildren(t);if(!data.length)$('rows').append(el('p','暂无数据'));}catch(e){$('state').textContent='连接失败';$('message').textContent=e.message}finally{running=false}}
async function showTrace(id){try{const d=await api('/api/traces/'+id);$('detail').style.display='block';$('traceTitle').textContent='Trace: '+id+'（'+d.spans.length+' spans）';const w=$('waterfall');w.replaceChildren();if(!d.spans.length){w.append(el('p','没有找到 Span'));return}const min=Math.min(...d.spans.map(s=>Number(s.start_ns)));const max=Math.max(...d.spans.map(s=>Number(s.end_ns)));const spanTotal=Math.max(1,max-min);for(const s of d.spans){const row=el('div',null,'trace-row'),bar=el('div',null,'trace-bar'),fill=el('i');const left=(Number(s.start_ns)-min)/spanTotal*100;const width=Math.max(.3,Number(s.end_ns-s.start_ns)/spanTotal*100);fill.style.left=left+'%';fill.style.width=Math.min(width,100-left)+'%';bar.append(fill);row.append(el('span',s.service+' / '+s.name),bar,el('span',s.duration_ms+' ms'));row.title='span_id='+s.span_id;w.append(row)}$('raw').textContent=JSON.stringify({spans:d.spans,related_logs:d.logs},null,2);$('detail').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){$('message').textContent=e.message}}
$('close').onclick=()=>$('detail').style.display='none';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));refresh()});$('refresh').onclick=refresh;let debounce;['service','search'].forEach(id=>$(id).oninput=()=>{clearTimeout(debounce);debounce=setTimeout(refresh,400)});setInterval(()=>{if($('auto').checked&&!document.hidden)refresh()},5000);refresh();
</script></body></html>
